name: Playwright Python Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_env:
        description: "Environment to run against"
        required: false
        default: "dev"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ github.event.inputs.app_env || 'dev' }}

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Install Playwright Chromium
      # --------------------------------------------------
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      # --------------------------------------------------
      # 5. Run Pytest
      # --------------------------------------------------
      - name: Run Pytest
        run: |
          pytest --browser chromium

      # --------------------------------------------------
      # 6. Upload Pytest HTML report
      # --------------------------------------------------
      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/report.html
          if-no-files-found: warn

      # --------------------------------------------------
      # 7. Upload raw Allure results
      # --------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # --------------------------------------------------
      # 8. Upload screenshots/videos/traces
      # --------------------------------------------------
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      # --------------------------------------------------
      # 9. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------------------------------------
      # 10. Install Allure CLI
      # --------------------------------------------------
      - name: Install Allure commandline
        if: always()
        run: |
          npm install -g allure-commandline

      # --------------------------------------------------
      # 11. Generate Allure HTML report
      # --------------------------------------------------
      - name: Generate Allure HTML report
        if: always()
        run: |
          rm -rf allure-report
          allure generate allure-results --clean -o allure-report

      # --------------------------------------------------
      # 12. Upload generated Allure report as artifact
      # --------------------------------------------------
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      # --------------------------------------------------
      # 13. Upload Allure report to GitHub Pages
      # --------------------------------------------------
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # ======================================================
  # Deploy Allure report to GitHub Pages
  # ======================================================
  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
