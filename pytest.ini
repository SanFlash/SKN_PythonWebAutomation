# This authorship notice is part of the project source and must be
# preserved in copies and forks (see NOTICE.md and LICENSE).
[pytest]
testpaths = tests
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

markers =
    smoke: quick, high-value checks
    regression: full regression suite
    booking: booking module tests
    contact: contact form tests
    gym: gym module tests
    food: food services module tests
    portfolio: portfolio module tests
    rooms: rooms / services module tests

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
